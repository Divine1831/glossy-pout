<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8edf0"><title>Payment confirmation — Glossy Pout</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet"><style>.payment-result{min-height:100dvh;max-width:480px;margin:auto;padding:30px 25px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:var(--bg)}.payment-result .confirmation-check{margin-bottom:26px}.payment-result h1{font:500 39px/1.12 var(--serif);color:var(--plum);margin:0 0 12px}.payment-result p:not(.eyebrow){font-size:13px;color:var(--muted);line-height:1.7}.payment-result .primary-button{margin-top:22px}.payment-result .eyebrow{margin-bottom:10px}</style></head><body><main class="payment-result"><div class="confirmation-check" id="resultIcon">…</div><p class="eyebrow">GLOSSY POUT · SECURE CHECKOUT</p><h1 id="heading">Checking your <em>payment…</em></h1><p id="message">Please wait while we confirm your transaction securely with Paystack.</p><a class="primary-button full-button" href="/">Continue shopping <span>→</span></a></main><script>
(async()=>{const params=new URLSearchParams(location.search);const reference=params.get('reference')||params.get('trxref');const heading=document.getElementById('heading');const message=document.getElementById('message');const icon=document.getElementById('resultIcon');if(!reference){icon.textContent='!';heading.textContent='No payment reference found';message.textContent='Return to the shop. If you completed a payment, contact Glossy Pout before trying again.';return;}try{const response=await fetch('/api/verify-payment?reference='+encodeURIComponent(reference),{cache:'no-store'});const data=await response.json();if(response.ok&&data.status==='paid'){icon.textContent='✓';heading.innerHTML='Payment <em>confirmed!</em>';message.textContent='Thank you for shopping with Glossy Pout. Your payment has been verified. We have received your order.';try{localStorage.removeItem('glossyPoutCart');}catch{}}else{icon.textContent='!';heading.innerHTML='Payment <em>not confirmed yet</em>';message.textContent=data.message||data.error||'Please contact Glossy Pout with your payment reference if you completed the transaction. Do not pay a second time until the status is checked.';}}catch(error){icon.textContent='!';heading.textContent='We could not check just now';message.textContent='Please try again later or contact Glossy Pout with your payment reference.';}})();
</script></body></html>
