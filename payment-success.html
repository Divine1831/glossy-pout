<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checking your payment | Glossy Pout</title><link rel="stylesheet" href="/styles.css"></head><body><main class="newsletter" style="min-height:100vh;display:grid;place-content:center"><p class="eyebrow">GLOSSY POUT CHECKOUT</p><h2 id="heading">Checking your <em>payment…</em></h2><p id="message">Please wait while we confirm your transaction securely with Paystack.</p><a class="button button-dark" href="/" style="justify-self:center">Back to Glossy Pout</a></main><script>
(async()=>{const ref=new URLSearchParams(location.search).get("reference");const h=document.getElementById("heading"),m=document.getElementById("message");if(!ref){h.textContent="No payment reference found";m.textContent="Return to the shop and check your order status.";return;}try{const r=await fetch("/api/verify-payment?reference="+encodeURIComponent(ref));const d=await r.json();if(r.ok&&d.status==="paid"){h.innerHTML="Payment <em>confirmed!</em>";m.textContent="Thank you for shopping with Glossy Pout. Your order number is "+(d.order_number||"available from your order confirmation")+". Save it to track your order. Your bag has been cleared.";try{localStorage.removeItem("glossyPoutCart");}catch{}}else{h.innerHTML="Payment <em>not confirmed yet</em>";m.textContent=d.message||d.error||"Please contact the shop if you completed payment. Do not pay a second time until your payment status is checked.";}}catch(e){h.textContent="We couldn't check just now";m.textContent="Please return later or contact the shop with your payment reference.";}})();
</script></body></html>
